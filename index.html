<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDR - Connexion</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <div class="container">
        <h1>⚔️ JDR ⚔️</h1>
        <div class="subtitle">Entrez dans l'Aventure</div>
        
        <!-- Formulaire de connexion -->
        <div id="login-form" class="auth-form active">
            <h2>🗝️ Connexion</h2>
            <div class="form-group">
                <label>Rôle:</label>
                <div class="role-selection">
                    <label><input type="radio" name="role" value="gm" checked> Maître du Jeu</label>
                    <label><input type="radio" name="role" value="player"> Joueur</label>
                </div>
            </div>
            <div class="form-group">
                <label>Nom de la partie:</label>
                <input type="text" id="login-party" placeholder="Entrez le nom de la partie">
            </div>
            <div class="form-group">
                <label>Nom d'utilisateur:</label>
                <input type="text" id="login-username" placeholder="Votre nom d'aventurier">
            </div>
            <div class="form-group">
                <label>Figurine de personnage (PNG):</label>
                <input type="file" id="login-avatar" accept="image/png">
            </div>
            <button class="btn-primary" onclick="handleLogin()">Entrer dans l'aventure</button>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
